<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">AuditAI: assistance with a human review boundary</title><desc id="desc">A conceptual workflow from repeatable tasks through AI assistance to human review. Not an internal architecture diagram.</desc>
<rect width="960" height="600" fill="#e6e6da"/>
<text x="56" y="65" font-family="system-ui,sans-serif" font-size="13" fill="#62645b" letter-spacing="2">AUDITAI / A PRODUCT DECISION</text>
<text x="56" y="139" font-family="Georgia,serif" font-size="42" fill="#24251f">Assistance belongs inside</text><text x="56" y="190" font-family="Georgia,serif" font-size="42" fill="#24251f">a reviewable workflow.</text>
<path d="M294 335H353 M611 335H670" fill="none" stroke="#355847" stroke-width="2"/><path d="m344 327 9 8-9 8m317-16 9 8-9 8" fill="none" stroke="#355847" stroke-width="2"/>
<g font-family="system-ui,sans-serif"><rect x="56" y="265" width="238" height="148" rx="3" fill="#f5f2ea" stroke="#8b9081"/><text x="80" y="302" font-size="12" fill="#62645b">01 / THE WORK</text><text x="80" y="344" font-size="20" fill="#24251f">Repeatable tasks</text><text x="80" y="378" font-size="14" fill="#62645b">Identify where help is useful</text>
<rect x="353" y="265" width="258" height="148" rx="3" fill="#f5f2ea" stroke="#8b9081"/><text x="377" y="302" font-size="12" fill="#62645b">02 / THE ASSISTANCE</text><text x="377" y="344" font-size="20" fill="#24251f">Specialized AI agents</text><text x="377" y="378" font-size="14" fill="#62645b">Prepare work for review</text>
<rect x="670" y="265" width="234" height="148" rx="3" fill="#355847"/><text x="694" y="302" font-size="12" fill="#f5f2ea">03 / THE BOUNDARY</text><text x="694" y="344" font-size="20" fill="#f5f2ea">Human judgment</text><text x="694" y="378" font-size="14" fill="#f5f2ea">Review before proceeding</text>
<path d="M56 475H904" stroke="#8b9081"/><text x="56" y="515" font-size="14" fill="#44483e">Six internal agents in operational use. People retain review and judgment.</text><text x="56" y="555" font-size="12" fill="#62645b">Explanatory reconstruction · No confidential system details shown</text></g></svg>