<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">BYU-I Support Agent RAG escalation flow</title>
  <desc id="desc">Intent routing, grounded retrieval, safety checks, answer with citations or handoff to staff</desc>
  <rect width="960" height="540" fill="#eeebe2"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="#f5f2ea" stroke="#d8d4c9"/>

  <text x="48" y="64" fill="#62645b" font-family="system-ui,sans-serif" font-size="13" font-weight="500">BYU–I / CONCEPTUAL ANSWER AND HANDOFF PATH</text>
  <text x="48" y="96" fill="#24251f" font-family="system-ui,sans-serif" font-size="22" font-weight="600">Intent - retrieve - check - answer or escalate</text>

  <rect x="48" y="160" width="150" height="80" rx="8" fill="#eeebe2" stroke="#8b9081"/>
  <text x="123" y="194" text-anchor="middle" fill="#24251f" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Student</text>
  <text x="123" y="214" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="11">Question in</text>

  <rect x="248" y="160" width="160" height="80" rx="8" fill="#eeebe2" stroke="#355847"/>
  <text x="328" y="194" text-anchor="middle" fill="#355847" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Intent router</text>
  <text x="328" y="214" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="11">Aid / Reg / Tech</text>

  <rect x="458" y="160" width="170" height="80" rx="8" fill="#eeebe2" stroke="#355847"/>
  <text x="543" y="194" text-anchor="middle" fill="#355847" font-family="system-ui,sans-serif" font-size="13" font-weight="600">RAG retrieval</text>
  <text x="543" y="214" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="11">Institutional sources</text>

  <rect x="678" y="148" width="234" height="104" rx="10" fill="#eeebe2" stroke="#355847" stroke-width="1.5"/>
  <text x="795" y="186" text-anchor="middle" fill="#355847" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Answer or handoff?</text>
  <text x="795" y="210" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="11">Can this question be helped?</text>
  <text x="795" y="230" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="11">Human support remains a path</text>

  <path d="M198 200 H242" stroke="#8b9081" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M408 200 H452" stroke="#8b9081" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M628 200 H672" stroke="#8b9081" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="160" y="360" width="280" height="100" rx="10" fill="#eeebe2" stroke="#355847"/>
  <text x="300" y="400" text-anchor="middle" fill="#24251f" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Answer + citations</text>
  <text x="300" y="424" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="12">Grounded response students can verify</text>
  <text x="300" y="444" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="12">against source docs</text>

  <rect x="520" y="360" width="280" height="100" rx="10" fill="#eeebe2" stroke="#355847"/>
  <text x="660" y="400" text-anchor="middle" fill="#24251f" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Handoff to staff</text>
  <text x="660" y="424" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="12">A route to a live representative</text>
  <text x="660" y="444" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="12">when an answer is not enough</text>

  <path d="M760 252 V330" stroke="#8b9081" stroke-width="2" fill="none"/>
  <path d="M760 330 H300" stroke="#8b9081" stroke-width="2" fill="none"/>
  <path d="M300 330 V354" stroke="#8b9081" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M760 330 H660" stroke="#8b9081" stroke-width="2" fill="none"/>
  <path d="M660 330 V354" stroke="#8b9081" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="480" y="318" text-anchor="middle" fill="#62645b" font-family="system-ui,sans-serif" font-size="11">Illustrative paths — not a production routing specification</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b9081"/>
    </marker>
  </defs>
</svg>
