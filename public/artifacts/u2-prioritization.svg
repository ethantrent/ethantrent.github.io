<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">U2 / FROM REQUIREMENT TO PRODUCT</title><desc id="desc">Make the next decision concrete.</desc><rect width="960" height="600" fill="#eeebe2"/><text x="48" y="62" fill="#355847" font-family="system-ui,sans-serif" font-size="16">U2 / FROM REQUIREMENT TO PRODUCT</text><text x="48" y="112" fill="#24251f" font-family="Georgia,serif" font-size="30">Make the next decision concrete.</text><rect x="48" y="184" width="272" height="230" fill="#f5f2ea" stroke="#d8d4c9"/><text x="68" y="224" fill="#355847" font-family="system-ui,sans-serif" font-size="14">01</text><text x="68" y="270" fill="#24251f" font-family="system-ui,sans-serif" font-size="19">Understand the need</text><text x="68" y="319" fill="#62645b" font-family="system-ui,sans-serif" font-size="15">Property and utility billing</text><text x="68" y="346" fill="#62645b" font-family="system-ui,sans-serif" font-size="15">Requirements to clarify</text><rect x="344" y="184" width="272" height="230" fill="#f5f2ea" stroke="#d8d4c9"/><text x="364" y="224" fill="#355847" font-family="system-ui,sans-serif" font-size="14">02</text><text x="364" y="270" fill="#24251f" font-family="system-ui,sans-serif" font-size="19">Build something usable</text><text x="364" y="319" fill="#62645b" font-family="system-ui,sans-serif" font-size="15">Translate into engineering work</text><text x="364" y="346" fill="#62645b" font-family="system-ui,sans-serif" font-size="15">Prototype, then discuss</text><rect x="640" y="184" width="272" height="230" fill="#f5f2ea" stroke="#d8d4c9"/><text x="660" y="224" fill="#355847" font-family="system-ui,sans-serif" font-size="14">03</text><text x="660" y="270" fill="#24251f" font-family="system-ui,sans-serif" font-size="19">Keep direction visible</text><text x="660" y="319" fill="#62645b" font-family="system-ui,sans-serif" font-size="15">Working billing product</text><text x="660" y="346" fill="#62645b" font-family="system-ui,sans-serif" font-size="15">AI capabilities proposed</text><text x="48" y="476" fill="#355847" font-family="Georgia,serif" font-size="24">Prototype cycles: weeks → days</text><text x="48" y="516" fill="#62645b" font-family="system-ui,sans-serif" font-size="16">Reported development result; not a measure of PRD authoring time.</text><text x="48" y="562" fill="#62645b" font-family="system-ui,sans-serif" font-size="14">Explanatory reconstruction · Not an internal planning document</text></svg>
